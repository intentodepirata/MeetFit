# Nixpacks configuration for Coolify deployment
# MeetFit - Flask + React application

[phases.setup]
nixPkgs = ['python310', 'nodejs-20_x', 'postgresql']

[phases.install]
cmds = [
    'npm install',
    'pip install -r requirements.txt'
]

[phases.build]
cmds = [
    'npm run build'
]

[phases.deploy]
cmds = [
    'flask db upgrade --directory ./migrations'
]

[start]
cmd = 'gunicorn wsgi --chdir ./src/ --bind 0.0.0.0:$PORT'
