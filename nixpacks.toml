# Nixpacks configuration for Coolify deployment
# MeetFit - Flask + React application

[phases.setup]
nixPkgs = ['python39', 'nodejs-18_x', 'postgresql']
cmds = [
    'flask db upgrade --directory ./migrations'
]

[phases.install]
cmds = [
    'npm install',
    'pip install -r requirements.txt'
]

[phases.build]
cmds = [
    'npm run build'
]

[start]
cmd = 'gunicorn wsgi --chdir ./src/ --bind 0.0.0.0:$PORT'

[variables]
# Python configuration
PYTHONUNBUFFERED = '1'
FLASK_APP = 'src/app.py'
